# Fly.io config for CCE Software (single app: backend serves the React SPA).
# Deploy with:  fly deploy --remote-only
app = "cce-product"
primary_region = "bom"   # Mumbai — closest to Maharashtra users

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "45s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
